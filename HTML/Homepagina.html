<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thijmen's pagina</title>
    <link rel="stylesheet" href="../CSS/Homepagina.css">
</head>
<body>

    <header>
        <a href="Homepagina.html"><img src="Images/Logo.png" alt="Logo"></a>


    </header>



    <main>
        
        <div class="sideMenu">
        <div class="sideMenuContent">
            <h3>Filters</h3>
            <p>Console:</p>
            <input onclick="filterConsole('switch2')" type="checkbox" id="switch2" name="switch2">
            <label for="switch2">Switch 2</label><br>
            <input onclick="filterConsole('switch')" type="checkbox" id="switch" name="switch">
            <label for="switch">Switch</label><br>
            <input onclick="filterConsole('wiiu')" type="checkbox" id="wiiu" name="wiiu">
            <label for="wiiu">Wii U</label><br>
            <input onclick="filterConsole('wii')" type="checkbox" id="wii" name="wii">
            <label for="wii">Wii</label><br>
            <input onclick="filterConsole('ds')" type="checkbox" id="ds" name="ds">
            <label for="ds">DS</label><br>
            <input onclick="filterConsole('3ds')" type="checkbox" id="3ds" name="3ds">
            <label for="3ds">3DS</label><br> 
            <br>
            <p>Condition:</p>
            <input onclick="filterCondition('new')" type="checkbox" id="new" name="new">
            <label for="new">New</label><br>
            <input onclick="filterCondition('used')" type="checkbox" id="used" name="used">
            <label for="used">Used</label><br>  
            <input onclick="filterCondition('broken')" type="checkbox" id="broken" name="broken">
            <label for="broken">Broken</label><br>
            <br>
            <p>Price:</p>
            <div class="priceRange">
                <div class="minPrice">
                    
                    <label for="minPrice">Min Price:</label>
                    <div class="euroSign">
                        <p>€</p>
                        <input oninput="applyFilters()" type="number" id="minPrice" name="minPrice" placeholder="Min Price">
                    </div>  
                </div>
                <br>
                <div class="maxPrice">
                    <label for="maxPrice">Max Price:</label>
                    <div class="euroSign">
                        <p>€</p>
                        <input oninput="applyFilters()" type="number" id="maxPrice" name="maxPrice" placeholder="Max Price">
                    </div>
                </div>
            </div>
            <br>
        </div>
    </div>

        </div>

    </main>

    <footer>

    </footer>

    
</body>
</html>
